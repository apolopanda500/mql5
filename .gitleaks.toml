# Gitleaks configuration for the mql5 trading repository (XAU_AI_PRO)
# https://github.com/gitleaks/gitleaks
#
# Formato gitleaks v8.25+ (`[[allowlists]]`). O ficheiro antigo que existia
# em `Files/XAU_AI_PRO/.gitleaks.toml` estava no formato pre-v8.19
# (`allowlist = [...]`), nao era trackeado e nenhum workflow o usava.
#
# Baseline medida em 09/11/2026 com gitleaks 8.30.1: 472 achados, todos
# `generic-api-key`:
#   - 458 em `Files/XAU_AI_PRO/**` (arvore vendorizada da app XAU_AI_PRO,
#     incluindo `dist/` e `frontend/.../_internal/`; a app e' auditada no
#     repo proprio `apolopanda500/XAU_AI_PRO`);
#   - 10 em `Experts/XAU_AI_PRO/PROGRESS.md*` (texto de log que cita
#     `MQL_TRADE_ALLOWED=0`, nao uma credencial);
#   - 4 em `Profiles/Templates/ALFA_G10_*.tpl` (atribuicoes VAZIAS:
#     `AIGatewayToken=` e `MCPServerToken=`).
# Depois desta config: 0 achados. Nenhum allowlist abaixo cobre HEAD de
# codigo novo: se um valor real for escrito num `.tpl` ou num ficheiro
# fora da arvore vendorizada, o gitleaks volta a falhar.

title = "mql5 / XAU_AI_PRO Gitleaks Configuration"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# 1. Arvore vendorizada da app. E' uma copia de outro repositorio que tem
#    o seu proprio scanner; varrer 205 MB de `dist`/`botocore` aqui duplica
#    o trabalho e produz 458 falsos positivos de dados de exemplo da AWS.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "arvore vendorizada da app XAU_AI_PRO (auditada no repo proprio)"
paths = [
  '''^Files/XAU_AI_PRO/''',
]

# ---------------------------------------------------------------------------
# 2. Logs de progresso. Citam variaveis de ambiente em prosa
#    (`MQL_TRADE_ALLOWED=0`), nao valores. Inclui os backups `.pre_p171`
#    e `.pre_p172` que guardam o mesmo texto.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "PROGRESS.md e backups: prosa que cita nomes de variaveis"
paths = [
  '''^Experts/XAU_AI_PRO/PROGRESS\.md''',
]

# ---------------------------------------------------------------------------
# 3. Templates com atribuicoes vazias. O gitleaks extrai como "segredo" a
#    linha SEGUINTE (`AIPollSeconds=15`, `RiskPercent=0.5`) porque o valor
#    do token esta' vazio; por isso o regex compara o MATCH completo:
#    so' passa `Token=` vazio seguido de imediato por outra atribuicao.
#    Um token real na mesma linha nao e' coberto.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "atribuicoes de token vazias em templates"
regexTarget = "match"
regexes = [
  '''(?m)^[A-Za-z0-9_]*(Token|Key|Secret|Password)=[[:space:]]*\r?\n[A-Za-z0-9_]+=[^\r\n]*$''',
]

# ---------------------------------------------------------------------------
# 4. Token de TESTE citado em docs de equipa (INBOX/DECISOES). O DONO
#    confirmou que `prova12345678` e' valor descartavel de uma tabela de
#    provas; no EA o input esta vazio (`ExternalBridgeToken: ""`) e
#    `EnableExternalBridge=false`. Literal exacto: nao cobre outro valor.
# ---------------------------------------------------------------------------
[[allowlists]]
description = "token de teste prova12345678 citado em documentacao"
regexTarget = "match"
regexes = [
  '''prova12345678''',
]
